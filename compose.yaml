name: llm-regression-lab-scaffold
x-local-environment: &local-environment
  LAB_LOCAL_ONLY: '1'
  LAB_DATABASE_HOST: postgres
  LAB_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  LAB_ARTIFACT_ROOT: /data/artifacts
  LAB_LOCAL_TOKENS: ${LAB_LOCAL_TOKENS:-}
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001_scaffold.sql:/docker-entrypoint-initdb.d/001_scaffold.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
  migrate:
    profiles: [local]
    build: .
    image: llm-regression-lab-local:dev
    environment: *local-environment
    command: [python, -m, llm_regression_lab.database]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    profiles: [local]
    build: .
    image: llm-regression-lab-local:dev
    environment: *local-environment
    ports:
      - "127.0.0.1:${LAB_PORT:-18080}:8000"
    volumes:
      - local_artifacts:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"
  worker:
    profiles: [local]
    build: .
    image: llm-regression-lab-local:dev
    environment:
      <<: *local-environment
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    command: [python, -m, llm_regression_lab.worker]
    volumes:
      - local_artifacts:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
volumes:
  postgres_data:
  local_artifacts:
