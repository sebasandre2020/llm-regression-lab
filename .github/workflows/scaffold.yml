name: Local service and scaffold validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-local.lock -r requirements-dev.txt
      - run: python -m ruff check src tests scripts
      - run: python scripts/validate_scaffold.py
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-local-only
      - name: Verify PostgreSQL bootstrap
        run: |
          docker compose up -d --wait postgres
          docker compose exec -T postgres psql -U lab -d lab -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM projects;"
        env:
          POSTGRES_PASSWORD: ci-local-only
      - name: Unit, contract and PostgreSQL integration tests
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://lab:ci-local-only@127.0.0.1:55432/lab
      - name: Build and run local HTTP demo
        run: |
          docker compose --env-file .env.example --profile local up -d --build --wait
          python scripts/local_demo.py
        env:
          POSTGRES_PASSWORD: ci-local-only
          LAB_TOKEN: local-dev-token-change-me-0123456789abcdef
      - if: always()
        run: docker compose --profile local down
        env:
          POSTGRES_PASSWORD: ci-local-only
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.3'
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform validate -no-color
